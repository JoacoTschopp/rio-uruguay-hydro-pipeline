rol: >-
  La referencia mas util para el diseno experimental: el LSTM gana en regresion y horizontes
  cortos, pero los modelos de atencion lo superan a medida que la tarea se complejiza, en
  particular en pronostico autorregresivo de 7 a 60 dias y en extremos. Encuadra la ventana de 1
  a 10 dias de esta tesis como zona de transicion, donde el resultado no esta decidido de
  antemano.
