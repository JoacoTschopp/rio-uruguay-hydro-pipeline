rol: >-
  Cuantifica sobre caudales observados cuanto aumenta El Nino la probabilidad de eventos
  extremos en Sudamerica. Justifica incluir indices de El Nino como covariables o como variable
  de estratificacion, y obliga a pensar si la particion de entrenamiento y prueba debe balancear
  fases en lugar de cortar por fecha. El Uruguay es de los rios mas sensibles a esa senal.
