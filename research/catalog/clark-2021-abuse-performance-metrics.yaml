rol: >-
  Muestra que NSE y KGE tienen una incertidumbre muestral enorme porque la distribucion de
  errores cuadraticos tiene colas pesadas: unos pocos dias de crecida dominan la metrica. Es el
  argumento para no rankear modelos por un unico valor puntual y reportar intervalos.
