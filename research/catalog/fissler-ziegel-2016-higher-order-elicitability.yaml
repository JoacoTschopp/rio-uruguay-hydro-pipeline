rol: >-
  Extiende la elicitabilidad a funcionales multidimensionales y muestra que un funcional no
  elicitable puede serlo como componente de uno de orden superior. Es el encuadre teorico que
  necesita una perdida expectilica cuyo tau depende del regimen, que de hecho es un funcional
  vectorial. Tiene erratum publicado.
