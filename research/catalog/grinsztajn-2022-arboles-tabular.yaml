rol: >-
  Benchmark sobre 45 conjuntos tabulares que muestra que los arboles siguen siendo estado del
  arte frente a redes profundas, y explica el mecanismo: aprenden mejor funciones objetivo no
  suaves y toleran variables no informativas. Justifica elegir arboles cuando el conjunto es
  tabular, de tamano medio y con predictores redundantes, que es el caso.
