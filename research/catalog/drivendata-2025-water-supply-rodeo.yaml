rol: >-
  Evidencia de que el resultado de la M5 se traslada a hidrologia con evaluacion externa y ciego
  temporal: en una competencia del Bureau of Reclamation sobre volumen estacional en 26 sitios,
  cuatro de los cinco equipos premiados usaron potenciacion de gradiente, y el segundo uso
  perdida cuantilica. Es el precedente concreto si esta tesis produce pronosticos por cuantiles.
