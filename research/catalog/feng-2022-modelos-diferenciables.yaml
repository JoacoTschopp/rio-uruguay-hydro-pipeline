rol: >-
  La referencia de hidrologia diferenciable: un modelo conceptual reescrito de forma derivable,
  con redes que regionalizan sus parametros, se acerca a la precision del LSTM puro pero
  conserva variables de estado interpretables y respeta el balance de masa. Es la alternativa si
  se exige interpretabilidad fisica o si hay que extrapolar.
