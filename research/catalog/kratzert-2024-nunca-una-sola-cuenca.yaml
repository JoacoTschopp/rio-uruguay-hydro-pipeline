rol: >-
  Advertencia metodologica directa contra el diseno de esta tesis: de 150 trabajos revisados,
  122 entrenaron sobre una sola cuenca, y el LSTM regional supera sistematicamente al de cuenca
  aislada. Es la referencia que un jurado usaria para atacar el diseno, asi que hay que
  justificar la cuenca unica o incorporar preentrenamiento regional.
