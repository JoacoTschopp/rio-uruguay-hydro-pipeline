rol: >-
  Formaliza que pasa con la consistencia cuando se transforma la variable dentro de la perdida,
  y define los funcionales de expectativa y expectil g-transformados. Es decir: una expectilica
  sobre log(Q) no estima el expectil de Q sino otro funcional, y este trabajo da la
  caracterizacion exacta. Habilita formalmente lo que hace la tesis.
