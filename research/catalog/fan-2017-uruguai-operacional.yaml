rol: >-
  La referencia mas directa al problema de esta tesis: evalua un sistema operativo de pronostico
  de caudal en el alto rio Uruguay, corrido a diario con 10 dias de anticipacion, entre 2013 y
  2016. Reporta que la ocurrencia de crecidas se anticipa con 2 a 3 dias utiles. Fija el piso de
  skill a superar y valida el horizonte de 1 a 10 dias como pregunta legitima en esta cuenca.
