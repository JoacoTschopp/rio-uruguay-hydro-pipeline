rol: >-
  El sistema operativo de alerta de crecidas de Google se entrena con la verosimilitud de una
  laplaciana asimetrica heterocedastica: una perdida asimetrica aprendida, no fija. Es la prueba
  de que el estado del arte operativo ya dejo el error simetrico para crecidas, y el antecedente
  mas fuerte con el que la tesis tiene que medirse.
