    estado: falta
    valor: "cuantiles 10/50/90 y cobertura empírica"
    implementar: {donde: rio_search/metrics.py, que: "cobertura de intervalo, ancho medio, pinball de evaluación", depende_de: [B1.09], esfuerzo: medio}
