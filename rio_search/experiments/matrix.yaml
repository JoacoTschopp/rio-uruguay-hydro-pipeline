    cmd: -m rio_search.train --loss gral --seeds 5 --groups caudal_estado --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 10
