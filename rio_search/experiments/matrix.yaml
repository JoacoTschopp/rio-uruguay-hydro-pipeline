    slug: patchtst
    prioridad: P2
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    referencia: "Nie et al. 2023. Parcheo temporal + independencia de canal; el transformer que sí le gana a DLinear en varios benchmarks."

  - id: B4.23
    nombre: iTransformer
    slug: itransformer
    prioridad: P3
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    referencia: "Liu et al. 2024. Invierte los ejes: atención entre variables en vez de entre tiempos."

  - id: B4.24
    nombre: Temporal Fusion Transformer
    slug: tft
    prioridad: P2
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    referencia: >-
      Lim et al. 2021. Es el único de la familia que distingue nativamente covariables
