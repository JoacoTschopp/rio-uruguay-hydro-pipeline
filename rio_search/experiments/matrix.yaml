- id: B6
  nombre: Ventana de entrenamiento y ponderación temporal
  eje: ventana
  pregunta: "¿La historia vieja aporta o estorba?"
  criterio_de_cierre: "B6.01–B6.03 corridas."
  celdas:

  - id: B6.01
