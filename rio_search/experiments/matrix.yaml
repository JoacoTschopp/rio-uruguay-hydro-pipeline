- id: B9
  nombre: Búsqueda de hiperparámetros
  eje: busqueda_hp
  pregunta: "¿Cuánto queda sobre la mesa por hiperparámetros, y qué eje importa?"
  criterio_de_cierre: "B9.01 corrida sobre los 2–3 finalistas de B4."
  regla: "El objetivo sale de VAL. TEST no entra en ningún trial (R3) — search.py ya lo hace así."
  celdas:

  - id: B9.01
    nombre: TPE
    slug: bo_tpe
    prioridad: P1
    estado: implementado
    valor: "optimización bayesiana estándar de Optuna, 60 trials"
    cmd: -m rio_search.search --trials 60 --sampler tpe --loss gral --metric gral --seeds-per-trial 3 --seeds-final 5 --gate-rain lluvia_media_est_mm
    tiempo_est_s: 420
    nota: >-
      **Usar `--seeds-per-trial 3` como mínimo.** Con 1 el desvío entre semillas de
      val/gral (~0,01) es comparable a la diferencia total que la búsqueda logra entre su
      mejor y su peor configuración razonable: el sampler termina persiguiendo
      inicializaciones afortunadas en vez de hiperparámetros. Es lineal en costo, así que
      es un cambio de precio, no de diseño.

  - id: B9.02
    nombre: procesos gaussianos
    slug: bo_gp
    prioridad: P2
    estado: falta
    valor: "sampler GP de Optuna, 40 trials"
    implementar:
      donde: entorno
      que: "instalar torch — GPSampler lo importa de forma diferida"
      depende_de: [torch]
      esfuerzo: bajo
    nota: >-
      Estaba marcada `implementado` y **no lo estaba**: falló el 2026-09-15 con
      `ModuleNotFoundError: No module named 'torch'`. El `GPSampler` de Optuna importa torch de forma
      diferida, así que el error no aparece hasta que el sampler se usa de verdad — por eso el catálogo
      la daba por corrible. Más adecuada que TPE con presupuesto chico de trials y espacio continuo,
      pero instalar torch es una decisión del usuario (y lo desbloquea todo B4 secuencial a la vez).

  - id: B9.03
    nombre: aleatorio (control)
    slug: bo_random
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.search --trials 60 --sampler random --loss gral --metric gral --seeds-per-trial 3 --seeds-final 5 --gate-rain lluvia_media_est_mm
    tiempo_est_s: 420
    nota: >-
      No es optimización bayesiana: es el **control** que dice si la BO aportó algo. Sin
      esta celda, "la BO encontró X" no es una afirmación verificable.

  - id: B9.04
    nombre: multi-objetivo
    slug: bo_nsga
    prioridad: P2
    estado: falta
    valor: "NSGA-II sobre (val/gral, val/rmse) o sobre (V⁺, FA húmedo): frente de Pareto"
    implementar: {donde: rio_search/search.py, que: "create_study(directions=[...]) y reporte del frente", depende_de: [], esfuerzo: medio}
    nota: >-
      Es la forma honesta de mostrar el trade-off que este proyecto tiene en el centro:
      gral compra V⁻ y KGE pagando ~30 m³/s de RMSE. Un frente de Pareto lo muestra; un
      escalar lo esconde.

  - id: B9.05
    nombre: Hyperband / ASHA
    slug: bo_asha
    prioridad: P3
    estado: falta
    implementar: {donde: rio_search/search.py, que: "cambiar el pruner; Optuna ya trae HyperbandPruner", depende_de: [], esfuerzo: bajo}
    nota: "Hoy usa MedianPruner. Con corridas de 2 s el podado no es el cuello de botella: P3 por eso."

  - id: B9.06
    nombre: CMA-ES
    slug: bo_cmaes
    prioridad: P3
    estado: falta
    implementar: {donde: rio_search/search.py, que: "agregar CmaEsSampler al diccionario de samplers", depende_de: [], esfuerzo: bajo}

  - id: B9.07
    nombre: espacio ampliado
    slug: espacio_ampliado
    prioridad: P2
    estado: falta
    valor: "sumar a SPACE: lookback, n_capas, dropout, escalado, ventana de TRAIN"
    implementar: {donde: rio_search/search.py, que: "SPACE condicional por familia de modelo", depende_de: [B2.17, B4.03, B7.02, B6.03], esfuerzo: medio}
    nota: >-
      **Acá es donde se recuperan las interacciones** que el descenso coordinado no ve
      (protocolo §10). Se corre al final, sobre los 2–3 finalistas, con los ejes acoplados
      liberados a la vez. τ_max no entra en el espacio nunca (R9).

