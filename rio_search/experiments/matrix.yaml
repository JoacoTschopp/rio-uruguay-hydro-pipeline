  - id: B4.26
    nombre: DeepAR
    slug: deepar
    prioridad: P3
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    referencia: "Salinas et al. 2020. Autorregresivo probabilístico; da la distribución completa por horizonte."

  - id: B4.27
    nombre: Echo State Network
    slug: esn
    prioridad: P3
    estado: falta
    valor: "reservoir computing: recurrencia aleatoria fija + salida lineal entrenada"
    implementar: {donde: rio_search/models.py, que: "NumPy puro, sin torch", depende_de: [], esfuerzo: medio}
    nota: "Entrena en segundos y en caudal rinde sorprendentemente bien. Barata y sin dependencias: buena relación evidencia/costo."

  - id: B4.28
    nombre: modelo conceptual (GR4J / HBV)
    slug: conceptual
    prioridad: P2
    estado: falta
    valor: "lluvia-escorrentía conceptual calibrado; como baseline y como generador de features de estado"
    implementar: {donde: rio_search/models.py, que: "GR4J de 4 parámetros calibrado sobre TRAIN", depende_de: [], esfuerzo: alto}
    nota: >-
      Dos usos y hay que separarlos: (a) baseline hidrológico —la comparación que la
      hidrología pide y que ningún baseline estadístico reemplaza—; (b) híbrido, sus
