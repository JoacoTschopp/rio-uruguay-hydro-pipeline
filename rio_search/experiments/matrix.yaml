# Catálogo de combinaciones de la búsqueda — Rio_Search
#
# Se recorre con el procedimiento de `docs/protocolo_busqueda_modelos.md`.
# Este archivo dice QUÉ existe; el protocolo dice CÓMO se recorre y cómo se lee.
#
# Cada celda es una combinación atribuible a **un** cambio contra el ancla (protocolo R4).
# El `id` es estable de por vida: es lo que permite comparar la misma celda entre
# versiones del dataset (protocolo §7).
#
# estado:
#   implementado           corre hoy con el `cmd` de la celda
#   falta                  hay que escribir código; NO se implementa sin autorización (R7)
#   bloqueado_dato         el dato no existe todavía en Gold
#   requiere_autorizacion  corre hoy, pero contradice una Decisión vigente
#
# prioridad:
#   P1  entra en el criterio de cobertura (§8.1). Sin estas la búsqueda no cierra.
#   P2  se corre si P1 no saturó el eje.
#   P3  exploratorio; sólo si el usuario lo pide.

version: 1
protocolo: docs/protocolo_busqueda_modelos.md
corredor: rio_search/runner.py     # python -m rio_search.runner --todo
python: .venv/Scripts/python.exe   # desde la raíz del repo

#: Métrica que se minimiza y que ordena el leaderboard.
objetivo: val/gral
#: Cuántos errores estándar tiene que superar una diferencia para no ser ruido.
umbral_sigmas: 2

# `cmd` lo ejecuta `rio_search.runner`, que le agrega:
#   --out rio_search/results/<DATASET_ID>/<id>__<slug>.json    (siempre)
#   --no-test                                                  (celdas `train` fuera de B11)
# Correr una celda a mano sin esos dos flags pisa resultados y calcula TEST de más.

# --------------------------------------------------------------------------------
# Configuración ancla — la fila de referencia. Se actualiza al cerrar cada bloque.
# --------------------------------------------------------------------------------
ancla:
  dataset_id: d278-76b949a2
  actualizada_en: B0.06
  model: mlp
  loss: gral
  groups: [caudal_estado, caudal_agregado_alta_frontera, lluvia_ratio, estacionalidad]
  horizon_strategy: multi_output
  split: rolling_365
  embargo_days: 14
  tau_mode: oracle
  tau_max: 0.85
  gate_rain: lluvia_media_est_mm
  # NO es la fuente preferible — la grilla MERGE lo es (media areal real). El ancla usa
  # estaciones porque es la fuente bajo la que se buscaron sus hiperparámetros y bajo la
  # que corrieron todos los resultados previos de `results/`. Cambiar la fuente mueve
  # val/gral de 0,497 a 0,549 con HP idénticos — 4× el umbral de ruido — así que ponerla
  # en el ancla mezclaría dos cambios (R4). MERGE se prueba como celda de un solo cambio
  # en B8.03; si gana, se vuelve el ancla y B9.01 re-busca HP bajo esa fuente.
  seeds: 5
  seed_base: 20260828
  hp: {hidden: 38, lr: 0.0492, l2: 0.000217, epochs: 378}
  # `patience` queda en el default 60 porque el CLI de train.py no lo expone (gaps G-01).
  # El mejor trial de search_gral_tpe_60.json usaba 81. Medido el 2026-09-05: el ancla da
  # val/gral 0,4969 ± 0,0096, idéntico al `final_multisemilla` de esa búsqueda — en esta
  # configuración corta el early stopping antes, así que la brecha no afecta al ancla.
  medido:
    fecha: 2026-09-05
    val: {gral: 0.4969, gral_sd: 0.0096, rmse: 1030, nse: 0.18, kge: 0.49, v_plus: 0.365, v_minus: 0.747}
    persistencia_val: {gral: 0.5145, rmse: 1083}
    skill_rmse: 0.049
    umbral_de_ruido: 0.0121
    dias: 9617
    splits: {train: 8939, val: 365, test: 285}
  flags_fijos: >-
    --model mlp --loss gral --seeds 5 --gate-rain lluvia_media_est_mm
    --tau-mode oracle --tau-max 0.85 --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378

# --------------------------------------------------------------------------------
# Ejes de la búsqueda
# --------------------------------------------------------------------------------
ejes:
  representacion:  {bloque: B2, saturado: false, desc: "cómo se le presenta la historia al modelo (features, lookback, derivadas)"}
  features:        {bloque: B2, saturado: false, desc: "qué grupos de columnas entran"}
  target:          {bloque: B3, saturado: false, desc: "qué se predice y en qué escala"}
  perdida:         {bloque: B1, saturado: false, desc: "qué se minimiza durante el entrenamiento"}
  modelo:          {bloque: B4, saturado: false, desc: "familia y arquitectura"}
  horizonte:       {bloque: B5, saturado: false, desc: "cómo se cubren los 8 horizontes"}
  ventana:         {bloque: B6, saturado: false, desc: "qué historia se usa para entrenar y con qué peso"}
  preproceso:      {bloque: B7, saturado: false, desc: "imputación y escalado"}
  modulador:          {bloque: B8, saturado: false, desc: "parámetros de τ (sensibilidad, no ajuste — R9)"}
  busqueda_hp:     {bloque: B9, saturado: false, desc: "cómo se buscan los hiperparámetros"}
  ensemble:        {bloque: B10, saturado: false, desc: "combinación de modelos"}

# --------------------------------------------------------------------------------
bloques:

# ================================================================================
- id: B0
  nombre: Piso, guardas y ancla
  eje: —
  pregunta: "¿El dato es el que dice ser, las guardas están verdes y cuál es la referencia?"
  criterio_de_cierre: "B0.01–B0.04 y B0.06 con estado ok. Sin esto ningún bloque posterior se puede leer."
  celdas:

  - id: B0.01
    nombre: frescura del snapshot
    slug: frescura
    prioridad: P1
    estado: implementado
    cmd: notebooks_local/gold_export/export_gold_dataset.py --refresh
    produce: DATASET_ID
    tiempo_est_s: 120
    nota: >-
      Consulta la historia de la tabla Delta, regenera el snapshot del Volume si Gold
      avanzó, baja el parquet y verifica el sha256. Si no hay credenciales de Databricks,
      parar y preguntar (protocolo §9) — no correr sobre el cache sin autorización.

  - id: B0.02
    nombre: tests del arnés
    slug: tests
    prioridad: P1
    estado: implementado
    cmd: -m pytest rio_search/tests -q
    tiempo_est_s: 12
    nota: "45 tests. Rojo = alto total (R2)."

  - id: B0.03
    nombre: auditoría de fuga
    slug: audit
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.audit
    tiempo_est_s: 10
    nota: >-
      Cubre lo que una revisión de columnas de Gold no ve: features derivadas, modulador y
      splits. Cada guarda va con su prueba negativa. Un proxy con 50 % de ruido pasa la
      guarda y baja el RMSE un 18 %: la guarda cubre el régimen realista (copia exacta o
      casi), no un proxy fuertemente degradado.

  - id: B0.04
    nombre: baselines
    slug: baselines
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.train --model mlp --loss gral --seeds 1 --gate-rain lluvia_media_est_mm --split val
    lee: "el bloque `baselines` del JSON"
    tiempo_est_s: 8
    nota: >-
      persistencia, persistencia×0,90, persistencia×1,10 y climatología 30 d salen en toda
      corrida de train. Persistencia es el piso de admisión (R6): RMSE ≈ 1.648 m³/s sobre
      d278. La persistencia amortiguada existe para exhibir el sesgo que RMSE no ve.

  - id: B0.05
    nombre: seasonal naive
    slug: seasonal_naive
    prioridad: P2
    estado: implementado
    eje: modelo
    valor: "Q̂(t+h) = media histórica del mismo día del año (±7 d, ajustada con TRAIN)"
    cmd: -m rio_search.train --model linear --loss mse --seeds 1 --epochs 200 --gate-rain lluvia_media_est_mm --split val
    lee: "baselines:estacional doy ±7d"
    tiempo_est_s: 6
    nota: >-
      El plan lo lista como baseline naïve (§3.3) y hoy no está. Importa porque es el
      único baseline que captura estacionalidad sin usar el estado actual del río: separa
      "el modelo aprendió el ciclo anual" de "el modelo aprendió la persistencia".
      `SeasonalNaive(7)` en models.py se ajusta con TRAIN únicamente y viaja en el bloque
      `baselines` de todo JSON de train; la celda lo lee de ahí (`lee: baselines:...`).
      El modelo entrenado del cmd es sólo el vehículo más barato para producir el JSON.

  - id: B0.06
    nombre: ancla
    slug: ancla
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.train --model mlp --loss gral --seeds 5 --gate-rain lluvia_media_est_mm --tau-mode oracle --tau-max 0.85 --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 12
    nota: >-
      La fila contra la que se mide todo. Su `val/gral` y su sd fijan el umbral de ruido
      (protocolo §5.1). Medido el 2026-09-05 sobre d278-76b949a2: ver `ancla.medido`.
      **Ojo con lo que ese número dice.** Sobre VAL el ancla le gana a persistencia por
      apenas 4,9 % de RMSE (1030 vs 1083), y en G-RAL su ventaja sobre el mejor baseline
      (persistencia ×1,10, G-RAL 0,5044) es de 0,0075 — **por debajo del umbral de ruido de
      0,0121, o sea un empate**. El año de VAL es bastante más duro que el de TEST, donde el
      skill de RMSE era ~22 %. Dos consecuencias: la guarda R6 es una restricción viva y no
      una formalidad, y el margen que la búsqueda tiene para mejorar es grande. Baselines
      VAL bajo estaciones: persistencia 0,5145 / ×0,90 0,5468 / ×1,10 0,5044 /
      climatología 30 d 0,6056.

# ================================================================================
- id: B1
  nombre: Función de pérdida
  eje: perdida
  pregunta: "¿Qué conviene minimizar? ¿Cuánto aporta la transformación log y cuánto la asimetría?"
  criterio_de_cierre: "Todas las P1 corridas o bloqueadas; ganador declarado o eje saturado."
  hipotesis_vigente: >-
    Evidencia acumulada sobre 5 configuraciones: mse_log gana RMSE 5/5; gral gana V⁻ 5/5
    y le gana a mse_log en V⁺, V⁻ y KGE 5/5 a costa de ~30 m³/s de RMSE; gral NO gana el
    escalar G-RAL de forma robusta (2/5). Un resultado distinto dispara §9 del protocolo.
  celdas:

  - id: B1.01
    nombre: mse
    slug: mse
    prioridad: P1
    estado: implementado
    valor: "cuadrática, escala cruda — el entrenamiento actual del proyecto"
    cmd: -m rio_search.train --loss mse --seeds 5 --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 10

  - id: B1.02
    nombre: mae
    slug: mae
    prioridad: P1
    estado: implementado
    valor: "absoluta, escala cruda"
    cmd: -m rio_search.train --loss mae --seeds 5 --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 10

  - id: B1.03
    nombre: mse_log
    slug: mse_log
    prioridad: P1
    estado: implementado
    valor: "cuadrática sobre ln Q — aísla el efecto de la transformación"
    cmd: -m rio_search.train --loss mse_log --seeds 5 --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 10

  - id: B1.04
    nombre: expectile_raw
    slug: expectile_raw
    prioridad: P1
    estado: implementado
    valor: "expectil τ sobre escala cruda — aísla el efecto de la asimetría"
    cmd: -m rio_search.train --loss expectile_raw --seeds 5 --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 10

  - id: B1.05
    nombre: gral
    slug: gral
    prioridad: P1
    estado: implementado
    valor: "expectil τ sobre ln Q — la propuesta (= ancla)"
    cmd: "(= B0.06)"
    tiempo_est_s: 0
    nota: "No se re-corre: es el ancla."

  - id: B1.06
    nombre: expectil con τ constante
    slug: expectile_tau_fijo
    prioridad: P1
    estado: implementado
    valor: "τ = 0,65 fijo, sin modulador"
    cmd: -m rio_search.train --loss gral --tau-constante 0.65 --seeds 5 --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 12
    nota: >-
      Es el **control que le falta a la tesis**: separa "la asimetría ayuda" de "el modulador
      ayuda". Sin esta celda, cualquier ganancia de gral se le puede atribuir al modulador sin
      evidencia. Prioridad P1 por eso. `--tau-constante` reemplaza el τ del entrenamiento por
      el escalar; la evaluación sigue usando el τ del modulador, así que la diferencia con el
      ancla mide sólo lo que aporta que τ varíe día a día.

  - id: B1.07
    nombre: huber
    slug: huber
    prioridad: P1
    estado: falta
    valor: "cuadrática cerca de 0, lineal en la cola (δ ajustable)"
    implementar:
      donde: rio_search/models.py
      que: "HuberLoss(delta) con value/grad elemento a elemento; registrar en LOSSES y en LOSS_CONFIGS (huber, huber_log)"
      depende_de: []
      esfuerzo: bajo
    referencia: "Huber 1964. Estándar en caudal por robustez a picos aislados y a errores de aforo."

  - id: B1.08
    nombre: log-cosh
    slug: logcosh
    prioridad: P2
    estado: falta
    valor: "aproximación suave de Huber, gradiente continuo en todo el dominio"
    implementar: {donde: rio_search/models.py, que: "LogCoshLoss", depende_de: [], esfuerzo: bajo}

  - id: B1.09
    nombre: pinball / cuantil
    slug: pinball
    prioridad: P2
    estado: falta
    valor: "pérdida cuantílica en q = 0,1 / 0,5 / 0,9"
    implementar:
      donde: rio_search/models.py
      que: "QuantileLoss(q); n_out = n_horizontes × n_cuantiles"
      depende_de: []
      esfuerzo: medio
    nota: >-
      El docstring de ExpectileLoss deja escrito por qué la familia expectil sirve para
      entrenar y pinball no, sin trucos: el gradiente de pinball es discontinuo en e = 0.
      Se corre igual **como control** y para producir intervalos (B10.05), no como
      candidata a campeón.

  - id: B1.10
    nombre: NSE-loss
    slug: nse_loss
    prioridad: P1
    estado: falta
    valor: "1 − NSE como pérdida, con normalización por varianza de la cuenca"
    implementar:
      donde: rio_search/models.py
      que: "pérdida por lote con denominador = varianza de TRAIN; el gradiente es el de MSE reescalado"
      depende_de: []
      esfuerzo: medio
    referencia: >-
      Kratzert et al. 2019 (Towards learning universal, regional, and local hydrological
      behaviors via ML). Es la pérdida estándar en rainfall-runoff con redes; entrenar con
      la métrica que la hidrología reporta es exactamente el argumento de esta tesis
      aplicado a otra métrica.

  - id: B1.11
    nombre: KGE-loss
    slug: kge_loss
    prioridad: P2
    estado: falta
    valor: "1 − KGE diferenciable (r, α, β por lote)"
    implementar: {donde: rio_search/models.py, que: "pérdida por lote; los tres términos son diferenciables", depende_de: [], esfuerzo: medio}
    nota: "KGE es la métrica que la tesis va a defender junto con NSE; entrenarla directo es la comparación honesta."

  - id: B1.12
    nombre: MSE ponderado por caudal
    slug: mse_weighted
    prioridad: P2
    estado: falta
    valor: "peso w(Q) = (Q/Q̄)^p, p ∈ {0.5, 1}"
    implementar: {donde: rio_search/models.py, que: "peso por muestra en el gradiente", depende_de: [], esfuerzo: bajo}
    nota: "Alternativa a la asimetría por modulador: pone el foco en crecida sin usar τ. Es el competidor directo de gral."

  - id: B1.13
    nombre: NLL gaussiano heterocedástico
    slug: nll_gauss
    prioridad: P3
    estado: falta
    valor: "el modelo predice μ y log σ² por horizonte"
    implementar: {donde: rio_search/models.py + train.py, que: "n_out = 2 × n_horizontes; inversa del target sobre μ", depende_de: [], esfuerzo: medio}
    nota: "Primer paso hacia pronóstico probabilístico. Da incertidumbre por día, que es lo que un operador necesita."

  - id: B1.14
    nombre: CRPS sobre ensemble de cuantiles
    slug: crps
    prioridad: P3
    estado: falta
    valor: "CRPS aproximado por cuantiles discretos"
    implementar: {donde: rio_search/models.py + metrics.py, que: "pérdida y métrica CRPS", depende_de: [], esfuerzo: alto}
    referencia: "Gneiting & Raftery 2007. Es la métrica estándar de pronóstico probabilístico."

# ================================================================================
- id: B2
  nombre: Features y representación de la entrada
  eje: features
  pregunta: "¿Qué información aporta y cuál estorba? ¿Alcanza con lags o hace falta ventana?"
  criterio_de_cierre: "Ablación completa (B2.04–B2.08) + al menos el grid CPTEC. Ganador o eje saturado."
  advertencia: >-
    **Los hiperparámetros del ancla se buscaron con 19 features.** Correrlos con 26 o con 7
    no los deja neutrales: la capacidad que le sobra o le falta al modelo se mezcla con el
    efecto de las features (protocolo §5.4). Este bloque **ordena candidatos**; el ganador
    entra a B9 con su propia búsqueda antes de que su ventaja se considere real.
  celdas:

  - id: B2.01
    nombre: default 19 features
    slug: feats19
    prioridad: P1
    estado: implementado
    cmd: "(= B0.06)"
    tiempo_est_s: 0

  - id: B2.02
    nombre: + grilla CPTEC (26 features)
    slug: feats26_cptec
    prioridad: P1
    estado: implementado
    valor: "agrega lluvia MERGE y temperatura SAMeT areales"
    cmd: -m rio_search.train --loss gral --seeds 5 --groups caudal_estado,caudal_agregado_alta_frontera,lluvia_ratio,cptec_grid,estacionalidad --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 14
    nota: "Media areal real de grilla, no una suma sobre un número variable de pluviómetros (Decisión 033)."

  - id: B2.03
    nombre: CPTEC en vez de estaciones
    slug: feats_solo_cptec
    prioridad: P1
    estado: implementado
    valor: "reemplaza lluvia_ratio por cptec_grid"
    cmd: -m rio_search.train --loss gral --seeds 5 --groups caudal_estado,caudal_agregado_alta_frontera,cptec_grid,estacionalidad --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 14
    nota: "Separa 'sumar CPTEC ayuda' de 'CPTEC reemplaza a las estaciones'. B2.02 sin esta celda no distingue las dos cosas."

  - id: B2.04
    nombre: "ablación: sin caudal_agregado_alta_frontera"
    slug: logo_agregado
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.train --loss gral --seeds 5 --groups caudal_estado,lluvia_ratio,estacionalidad --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 12

  - id: B2.05
    nombre: "ablación: sin lluvia"
    slug: logo_lluvia
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.train --loss gral --seeds 5 --groups caudal_estado,caudal_agregado_alta_frontera,estacionalidad --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 12
    nota: "τ sigue saliendo de la lluvia aunque la lluvia no sea feature: el modulador es independiente del grupo de features."

  - id: B2.06
    nombre: "ablación: sin estacionalidad"
    slug: logo_doy
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.train --loss gral --seeds 5 --groups caudal_estado,caudal_agregado_alta_frontera,lluvia_ratio --gate-rain lluvia_media_est_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 12

