- id: B11
  nombre: Confirmación y cierre
  eje: —
  pregunta: "¿La ventaja del campeón sobrevive a cambiar de año, y cuánto vale en TEST?"
  criterio_de_cierre: "Los cuatro puntos de §8.1 del protocolo."
  regla: "ES EL ÚNICO BLOQUE DONDE SE MIRA TEST (R3)."
  celdas:

  - id: B11.01
    nombre: walk-forward anidado del campeón
    slug: wf_campeon
    prioridad: P1
    estado: implementado
    valor: "5 folds anuales, BO dentro de cada fold sobre su propio VAL"
    cmd: -m rio_search.walkforward --ventanas expandible --n-folds 5 --trials 30 --seeds-per-trial 2 --seeds-final 3 --loss gral --gate-rain lluvia_media_est_mm
    tiempo_est_s: 850
    nota: >-
      Es la forma anidada: la búsqueda corre **dentro** de cada fold, que es la única que
      no usa información del futuro del fold para elegir su configuración. Tres cosas que
      mezcla a propósito y hay que leer juntas: el año de TEST cambia entre folds, los
      hiperparámetros cambian entre folds, y el último fold suele ser parcial (queda
      marcado y no entra en las medias). Criterio de confirmación: **el campeón le gana al
      ancla en ≥ 3 de los 4 folds completos**, no en la media.

  - id: B11.02
    nombre: TEST único
    slug: test_unico
    prioridad: P1
    estado: implementado
    valor: "la configuración campeona, 5 semillas, TEST leído una sola vez"
    cmd: "(el JSON del campeón ya lo tiene calculado; acá se lo lee y se lo registra)"
    tiempo_est_s: 0
    nota: >-
      No se re-entrena: se lee el bloque `test` del JSON del campeón, se reporta con su
      desvío entre semillas y se escribe en el ledger. TEST son 285–365 días de un solo
      año hidrológico: se reporta como media ± desvío y las diferencias menores al desvío
      no se leen.

  - id: B11.03
    nombre: significancia entre finalistas
    slug: diebold_mariano
    prioridad: P2
    estado: implementado
    valor: "test de Diebold-Mariano sobre las pérdidas diarias, con varianza HAC (Newey-West, h−1 rezagos) y corrección HLN"
    cmd: -m rio_search.dm --seeds 5 --hac-h 14 --gate-rain lluvia_media_est_mm
    tiempo_est_s: 60
    referencia: >-
      Diebold & Mariano 1995; Harvey, Leybourne & Newbold 1997. Es el test estándar para
      decir si dos pronósticos difieren de verdad. El desvío entre semillas (§5.1) cubre el
      ruido de inicialización; DM cubre el ruido de la muestra temporal, que es el que queda.
      `metrics.dm_test` recibe pérdidas por día (ψ_τ en log y el cuadrático simétrico de
      control); el driver `rio_search.dm` promedia las predicciones entre semillas y corre
      el ancla contra los finalistas **en VAL** — la pasada sobre TEST es del cierre (B11.02),
      una sola vez y sobre el campeón ya elegido.

  - id: B11.04
    nombre: lectura por horizonte y por régimen
    slug: desglose
    prioridad: P1
    estado: implementado
    valor: "métricas por h ∈ {1..7, 14} y por régimen de τ"
    cmd: "(el bloque `per_horizon` ya está en cada JSON)"
    tiempo_est_s: 0
    nota: >-
      El escalar promedia 8 horizontes muy distintos: t+1 es casi persistencia y t+14 es
      otro problema. Un campeón que gana el promedio perdiendo t+1 no sirve para operar.

  - id: B11.05
    nombre: informe final y propuesta de Decisión
    slug: informe
    prioridad: P1
    estado: implementado
    cmd: "(redacción; sin comando)"
    nota: >-
      Salida: leaderboard final, qué eje aportó cuánto, qué quedó bloqueado y por qué, y
      una entrada propuesta para `decisions.md`. **La propone el agente y la aprueba el
      usuario** — no se escribe en decisions.md sin autorización.

# --------------------------------------------------------------------------------
# Brechas transversales del arnés — no son celdas, son lo que hace falta para que
# varias celdas se puedan correr o leer bien. Igual que las celdas `falta`: se
# reportan y se espera autorización (protocolo R7).
# --------------------------------------------------------------------------------
gaps:
  - id: G-01
    titulo: "train.py no expone --patience ni --train-start"
    estado: cerrada
    cerrada_en: 2026-09-05
    impacto: >-
      El ancla no podía reproducir exactamente el mejor trial de la BO (patience 81 vs 60
      por defecto), y B6.03 no se podía correr aunque make_splits ya aceptara train_start.
    resolucion: >-
      `--patience` y `--train-start` agregados al CLI de train.py, y los dos quedan
      registrados en el bloque `run_config` del JSON. B6.03 pasó a `implementado`. Medido:
      el ancla da el mismo val/gral con patience 60 y con 81 — en esa configuración corta
      el early stopping antes, así que la brecha existía pero no la afectaba.

  - id: G-02
    titulo: "la transformación del target está acoplada a la pérdida"
    impacto: >-
      LOSS_CONFIGS mapea nombre → (pérdida, transformación), así que target y pérdida no
      son ejes independientes. Bloquea B3.03–B3.06 y cualquier combinación tipo
      (huber, raíz cuarta).
    esfuerzo: medio

  - id: G-03
    titulo: "no hay forma de no calcular TEST"
    estado: cerrada
    cerrada_en: 2026-09-05
    impacto: >-
      run_experiment evaluaba TEST siempre y lo escribía en el JSON, así que R3 se sostenía
      por disciplina de quien leía, no por el código.
    resolucion: >-
      `--no-test` en train.py (y `evaluar_test` en run_experiment / run_baselines /
      run_comparison): el bloque directamente no se calcula ni se escribe. El corredor se
      lo agrega solo a toda celda `train` fuera de B11, así que la regla pasó a ser
      estructural. `--split test` junto con `--no-test` ahora es un error explícito.
      Queda abierto para search.py y walkforward.py, que no tienen el flag: ahí el corredor
      no lee TEST y el ledger guarda "no_leido".

  - id: G-04
    titulo: "sensitivity.py tenía --split test por defecto"
    estado: cerrada
    cerrada_en: 2026-09-05
    impacto: "Correrlo sin --split val violaba R3 en silencio."
    resolucion: "El default pasó a `val`. Un barrido de sensibilidad se corre muchas veces; leerlo en TEST convierte el conjunto de prueba en criterio de selección."

  - id: G-05
    titulo: "no se guardan las predicciones"
    impacto: >-
      Sólo se guardan métricas agregadas. Sin las predicciones por día no se puede hacer
      ensemble (B10), ni Diebold-Mariano (B11.03), ni graficar hidrogramas, ni analizar
      residuos. Es la brecha que más celdas bloquea después de B2.17.
    esfuerzo: medio

  - id: G-06
    titulo: "no hay MLflow"
    impacto: >-
      Los resultados van a JSON. El plan (§3.5) pide tracking en Databricks con procedencia
      de código y tiempos. Con ~120 celdas × varias versiones del dataset, el ledger JSONL
      alcanza pero no escala a la comparación cruzada que la tesis va a querer.
    esfuerzo: alto

  - id: G-08
    titulo: "train.py revienta al imprimir si --out cae fuera del repo"
    estado: cerrada
    cerrada_en: 2026-09-05
    resolucion: "`relative_to` envuelto en try/except, igual que en search.py y walkforward.py."
    impacto: >-
      `out_path.relative_to(REPO_ROOT)` sin guarda: el JSON se escribe bien y después la
      corrida muere con ValueError. search.py y walkforward.py ya lo envuelven en try/except;
      train.py no. El protocolo siempre escribe dentro del repo, así que no lo toca — pero
      es una corrida perdida para cualquiera que use un --out externo.
    esfuerzo: bajo

  - id: G-07
    titulo: "no hay corredor del catálogo"
    estado: cerrada
    cerrada_en: 2026-09-05
    impacto: >-
      El agente ejecutaba celda por celda y escribía el ledger a mano, así que el protocolo
      dependía de que lo interpretara bien cada vez.
    resolucion: >-
      `rio_search/runner.py`. Lee este YAML, resuelve el DATASET_ID desde el manifest, corre
      lo implementado en orden de bloque, calcula el veredicto contra el ancla con el umbral
      de ruido y hace append al ledger. `--estado` es la fase F0, `--todo` es el replay
      completo, `--deriva` es el informe de §7. Cuando cambia el dataset, cierra las filas
      viejas como históricas antes de correr nada.

# --------------------------------------------------------------------------------
resumen:
  celdas_totales: 111
  implementadas: 37          # 26 con comando propio + 11 que reusan la corrida de otra celda
  faltan: 71
  bloqueadas_por_dato: 2     # B2.19, B8.05 — Fase 4 del roadmap del dataset
  requieren_autorizacion: 1  # B2.11 — contradice la Decisión 018
  celdas_P1: 56              # de las cuales 35 corren hoy
  reloj_de_lo_implementado: >-
    ~90 min para las 37 celdas implementadas; **~33 min sin las tres celdas de
    walk-forward** (B6.02, B6.04, B11.01), que solas se llevan el resto. Los tiempos de las
    celdas de entrenamiento se recalibraron el 2026-09-05 contra lo medido: una corrida de
    5 semillas con `--no-test` tarda 3–7 s, no los ~60 que se habían estimado. El replay
    completo del catálogo implementado es, en la práctica, media hora.
  camino_mas_corto_a_un_cierre: >-
    Con lo implementado hoy se corren B0 completo, B1 (5 de 14), B2 (7 de 19), B4 (2 de 28),
    B6 (4 de 6), B8 (3 de 5), B9 (3 de 7) y B11 (4 de 5). Eso cierra el eje `perdida`, la
    ablación de features y la sensibilidad del modulador — pero **no** alcanza para el criterio
    de finalización: sin B2.17 (ventana), B4.08/B4.09 (GBM), B4.13 (DLinear), B4.14 (LSTM),
    B5.02 (per_horizon), B3.04 (target diferencial), B1.06 (τ constante) y B1.10 (NSE-loss),
    la cobertura de P1 queda incompleta y la búsqueda sigue abierta. Lo que sí está cerrado
    es la **repetibilidad**: `python -m rio_search.runner --todo` re-corre el catálogo entero
    sobre el dataset que haya, sin intervención.
  tres_desbloqueos_de_mayor_impacto:
    - "B2.17 (ventana / lookback) — habilita 13 celdas de B4"
    - "G-05 (guardar predicciones) — habilita todo B10 y B11.03"
    - "B4.09 o B4.13 (LightGBM o DLinear) — la comparación fuerte que hoy no existe"
