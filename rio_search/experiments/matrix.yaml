- id: B10
  nombre: Ensembles
  eje: ensemble
  pregunta: "¿Combinar los finalistas gana más que elegir uno?"
  criterio_de_cierre: "B10.01 y B10.02 corridas sobre el top-3 de B4."
  celdas:

  - id: B10.01
    nombre: promedio entre semillas
    slug: ens_semillas
    prioridad: P1
    estado: falta
    valor: "promediar las **predicciones** de las N semillas, no sus métricas"
    implementar: {donde: rio_search/train.py, que: "guardar predicciones por semilla y evaluar el promedio", depende_de: [], esfuerzo: bajo}
    nota: >-
      Hoy se promedian métricas, que es otra cosa. El promedio de predicciones casi siempre
      gana a la media de las métricas individuales, es gratis (las corridas ya existen) y
      es el ensemble que un operador puede desplegar sin cambiar nada.

  - id: B10.02
    nombre: promedio entre configuraciones
    slug: ens_top3
    prioridad: P1
    estado: falta
    valor: "media simple de las predicciones de los 3 mejores de B4"
    implementar: {depende_de: [B10.01], esfuerzo: bajo}

  - id: B10.03
    nombre: stacking
    slug: ens_stacking
    prioridad: P2
    estado: falta
    valor: "meta-modelo lineal con pesos ajustados en VAL"
    implementar: {donde: rio_search/ (módulo nuevo), que: "meta-regresión sobre predicciones out-of-fold", depende_de: [B10.01], esfuerzo: medio}
    nota: "Ojo: ajustar los pesos en el mismo VAL que seleccionó los miembros contamina la selección. Hace falta un VAL interno o folds anidados; dejarlo escrito."

  - id: B10.04
    nombre: mezcla ponderada por régimen
    slug: ens_por_regimen
    prioridad: P2
    estado: falta
    valor: "peso función de τ: un modelo para crecida, otro para estiaje"
    implementar: {depende_de: [B10.01], esfuerzo: medio}
    nota: >-
      Es la extensión natural de la tesis: si el costo depende del régimen, el **modelo**
      también puede depender del régimen. El modulador ya da τ por día y es causal, así que la
      mezcla es operable.

  - id: B10.05
    nombre: intervalos de predicción
    slug: ens_intervalos
