    nota: >-
      Las columnas existen y tienen datos reales (Decisión 028), pero la Decisión 018 las
      deja fuera del alcance de la tesis. Correrlas es un experimento válido; **adoptarlas
      requiere revisar la Decisión 018** y eso lo decide el usuario (protocolo §9).
      Hidrológicamente además son aguas abajo del punto de predicción: si aportan, hay que
      explicar por qué y descartar que sea un efecto de calendario compartido.

  - id: B2.12
    nombre: índice de precipitación antecedente (API)
    slug: feats_api
    prioridad: P1
    estado: falta
    valor: "API(t) = Σ k^i · P(t−i), k ∈ {0.85, 0.90, 0.95}"
    implementar: {donde: rio_search/data.py (_derive_rain), que: "columnas api_k085/090/095", depende_de: [], esfuerzo: bajo}
    referencia: >-
      Índice clásico de humedad antecedente en hidrología (Kohler & Linsley 1951). Es la
      misma idea que ya usa el modulador para armar A(t): si sirve para decidir el régimen,
      la hipótesis obvia es que sirve como feature. P1 por barata y por directamente
      comparable con el modulador.

  - id: B2.13
    nombre: derivadas de recesión del caudal
    slug: feats_recesion
    prioridad: P1
    estado: falta
    valor: "log(Q_t / Q_{t−1}), d²Q/dt², días desde el último pico, pendiente de recesión"
    implementar: {donde: rio_search/data.py, que: "grupo `dinamica_caudal`", depende_de: [], esfuerzo: medio}
    nota: >-
      Hoy sólo hay caudal_delta_1d. La curva de recesión es la firma física de la cuenca y
      es lo que distingue "el río está bajando desde un pico" de "el río está estable" a
      igual caudal absoluto.

  - id: B2.14
    nombre: acumulados de lluvia largos
    slug: feats_lluvia_larga
    prioridad: P2
    estado: falta
    valor: "acum 60 d y 90 d, y el ratio acum_7d / acum_30d"
    implementar: {donde: rio_search/data.py (_derive_rain), que: "agregar 60 y 90 a la tupla de ventanas", depende_de: [], esfuerzo: bajo}

  - id: B2.15
    nombre: log1p del caudal como feature
    slug: feats_log_caudal
    prioridad: P2
    estado: falta
    valor: "ln de las columnas de caudal, además o en vez de la escala cruda"
    implementar: {donde: rio_search/train.py (Preprocessor), que: "transformación por columna declarada, no sólo del target", depende_de: [], esfuerzo: medio}
    nota: "El target log ya gana; la hipótesis es que la entrada log también linealiza la relación."

  - id: B2.16
    nombre: interacción lluvia × humedad antecedente
    slug: feats_interaccion
    prioridad: P2
    estado: falta
    valor: "P(t) · API(t): la misma lluvia produce distinta respuesta según el estado de la cuenca"
    implementar: {donde: rio_search/data.py, que: "columna producto; depende de B2.12", depende_de: [B2.12], esfuerzo: bajo}
    nota: "Es la no-linealidad hidrológica más conocida. Un MLP la puede aprender, un lineal no: la celda también mide cuánto de la ventaja del MLP viene de acá."

  - id: B2.17
    nombre: ventana / lookback explícito
    slug: lookback
    prioridad: P1
    estado: falta
    eje: representacion
    valor: "tensores (N, L, F) con L ∈ {30, 60, 90, 120}"
    implementar:
      donde: rio_search/data.py
      que: "make_sequences(ds, lookback) → X (N, L, F); el MLP la consume aplanada, los secuenciales tal cual"
      depende_de: []
      esfuerzo: medio
    nota: >-
      **Prerrequisito de todo B4 secuencial** (LSTM, TCN, transformers). Hoy la historia
      entra sólo como lags fijos elegidos a mano. Es la celda que más desbloquea del
      catálogo entero.

  - id: B2.18
    nombre: selección automática de features
    slug: feats_seleccion
    prioridad: P3
    estado: falta
    valor: "importancia por permutación sobre VAL; RFE"
    implementar: {donde: rio_search/ (módulo nuevo), que: "permutación de columnas y re-evaluación", depende_de: [], esfuerzo: medio}
    nota: "Complementa la ablación por grupo con una lectura por columna. No selecciona nada por sí sola: informa."

  - id: B2.19
    nombre: features de pronóstico numérico
    slug: feats_forecast
    prioridad: P1
    estado: bloqueado_dato
    valor: "TIGGE / GEFS: lluvia y temperatura pronosticadas por lead"
    bloqueado_por: "Fase 4 del roadmap del dataset. Gold v278 no tiene ninguna columna de pronóstico (66 columnas verificadas)."
    nota: >-
      Cuando lleguen: son legítimamente información sobre el futuro emitida en t₀, así que
      pueden superar el umbral de la auditoría de fuga. La salida correcta es declararlas
      en `audit.FUTURO_LEGITIMO` con justificación — **nunca** bajar el umbral. Desbloquea
      también B8.05 (modo `forecast` del modulador), que es el único operable de verdad.

# ================================================================================
- id: B3
  nombre: Parametrización del target
  eje: target
  pregunta: "¿Qué conviene predecir: el caudal, su logaritmo, su cambio o su razón?"
  criterio_de_cierre: "B3.01–B3.04 corridas o bloqueadas."
  celdas:

  - id: B3.01
    nombre: crudo
    slug: target_crudo
    prioridad: P1
    estado: implementado
    cmd: "(= B1.01, la transformación va atada a la pérdida)"
    nota: "Hoy `target_transform` no es un eje independiente: LOSS_CONFIGS lo acopla a la pérdida. Ver gaps G-02."

  - id: B3.02
    nombre: logarítmico
    slug: target_log
    prioridad: P1
    estado: implementado
    cmd: "(= B1.03 / B1.05)"

  - id: B3.03
    nombre: raíz cuarta / Box-Cox / Yeo-Johnson
    slug: target_potencia
    prioridad: P1
    estado: falta
    valor: "Q^(1/4) — la transformación de varianza estabilizada clásica en caudal; λ de Box-Cox ajustado en TRAIN"
    implementar: {donde: rio_search/train.py (Preprocessor), que: "target_transform ∈ {none, log, pow4, boxcox, yeojohnson}", depende_de: [], esfuerzo: medio}
    referencia: >-
      La raíz cuarta es el estándar en hidrología cuando log sobre-comprime las crecidas.
      Es la competidora directa de log y hoy no está probada: la conclusión "el log es el
      factor de precisión" se sostiene sobre una comparación de dos, no de tres.

  - id: B3.04
    nombre: target diferencial
    slug: target_delta
    prioridad: P1
    estado: falta
    valor: "predecir Q(t+h) − Q(t) y reconstruir sumando"
    implementar: {donde: rio_search/data.py + train.py, que: "target_param ∈ {nivel, delta, ratio}; la inversa suma q_actual", depende_de: [], esfuerzo: medio}
    nota: >-
      Elimina de raíz el problema de que el modelo se refugie en la persistencia: la parte
      trivial ya está descontada y lo que el modelo aprende es el residuo. Es la
      parametrización que más suele mover la aguja en series con autocorrelación alta.

  - id: B3.05
    nombre: target de razón logarítmica
    slug: target_ratio
    prioridad: P2
    estado: falta
    valor: "predecir ln(Q(t+h) / Q(t))"
    implementar: {donde: "igual que B3.04", depende_de: [B3.04], esfuerzo: bajo}
    nota: "Combina delta y log: cambio relativo. Es lo que un hidrólogo lee (\"el río sube 30 %\")."

  - id: B3.06
    nombre: estandarización estacional del target
    slug: target_estacional
    prioridad: P3
    estado: falta
    valor: "(Q − μ_doy) / σ_doy con climatología ajustada en TRAIN"
    implementar: {donde: rio_search/train.py, que: "climatología por día del año con suavizado", depende_de: [], esfuerzo: medio}

# ================================================================================
- id: B4
  nombre: Familia de modelo
  eje: modelo
  pregunta: "¿Qué arquitectura pronostica mejor con todo lo demás fijo?"
  criterio_de_cierre: "Todas las P1 corridas o bloqueadas; top-3 identificado para B9 y B11."
  orden_de_lectura: >-
    Antes de cualquier transformer hay que tener corridas DLinear (B4.15) y LightGBM
    (B4.10). Zeng et al. 2023 mostraron que un lineal simple gana a los transformers en
    buena parte de los benchmarks de series temporales; sin ese control, una comparación
    de transformers no dice nada. Y en tabular con pocos miles de filas el gradient
    boosting sigue siendo el estado del arte de facto.
  celdas:

  - id: B4.01
    nombre: lineal L2
    slug: linear
    prioridad: P1
    estado: implementado
    cmd: -m rio_search.train --model linear --loss gral --seeds 5 --gate-rain lluvia_media_est_mm --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 10
    nota: "Se entrena por gradiente y no en forma cerrada justamente para que acepte la pérdida asimétrica."

  - id: B4.02
    nombre: MLP 1 capa
    slug: mlp1
    prioridad: P1
    estado: implementado
    cmd: "(= B0.06)"

  - id: B4.03
    nombre: MLP profundo
    slug: mlp_profundo
    prioridad: P1
    estado: falta
    valor: "2–4 capas ocultas, con dropout y/o conexiones residuales"
    implementar: {donde: rio_search/models.py, que: "MLPCore con lista de anchos; el backward se generaliza a N capas", depende_de: [], esfuerzo: medio}
    nota: "MLPCore hoy tiene exactamente una capa oculta con tanh. Sin esta celda no se sabe si el techo del MLP es la profundidad o los datos."

  - id: B4.04
    nombre: regresión cuantílica lineal
    slug: quantile_linear
    prioridad: P2
    estado: falta
    implementar: {donde: rio_search/models.py, que: "LinearCore + QuantileLoss (B1.09)", depende_de: [B1.09], esfuerzo: bajo}

  - id: B4.05
    nombre: SARIMAX con exógenas
    slug: sarimax
    prioridad: P2
    estado: falta
    valor: "ARIMA estacional con lluvia y caudal agregado como exógenas"
    implementar: {donde: rio_search/models.py, que: "adaptador statsmodels; por horizonte", depende_de: [statsmodels], esfuerzo: medio}
    nota: "Es la referencia estadística clásica que un tribunal de tesis va a preguntar. No hace falta que gane; hace falta que esté."

  - id: B4.06
    nombre: Random Forest
    slug: random_forest
    prioridad: P2
    estado: falta
    implementar: {donde: rio_search/models.py, que: "adaptador sklearn; multi-output nativo", depende_de: [scikit-learn], esfuerzo: bajo}
    nota: "No acepta la pérdida asimétrica: se corre con MSE y se compara sólo en las métricas, dejándolo escrito."

  - id: B4.07
    nombre: Extra Trees
    slug: extra_trees
    prioridad: P3
    estado: falta
    implementar: {donde: rio_search/models.py, que: "adaptador sklearn", depende_de: [scikit-learn], esfuerzo: bajo}

  - id: B4.08
    nombre: XGBoost
    slug: xgboost
    prioridad: P1
    estado: falta
    valor: "gradient boosting con objetivo custom"
    implementar: {donde: rio_search/models.py, que: "adaptador; objetivo custom con grad/hess — la pérdida expectil los tiene analíticos", depende_de: [xgboost], esfuerzo: medio}
    nota: >-
      **La familia que más chance tiene de ganar** en un tabular de 9.600 filas y 19–26
      columnas. Y acepta objetivo custom, así que gral se puede entrenar de verdad: es la
      comparación fuerte de la tesis, no una concesión.

  - id: B4.09
    nombre: LightGBM
    slug: lightgbm
    prioridad: P1
    estado: falta
    implementar: {donde: rio_search/models.py, que: "adaptador; objetivo custom + soporte nativo de cuantiles", depende_de: [lightgbm], esfuerzo: medio}
    nota: "Más rápido que XGBoost en este tamaño y con objetivo cuantílico nativo. Uno de los dos (B4.08/B4.09) es P1 obligatorio; el otro pasa a P2 si el primero corre."

  - id: B4.10
    nombre: CatBoost
    slug: catboost
    prioridad: P3
    estado: falta
    implementar: {donde: rio_search/models.py, que: "adaptador", depende_de: [catboost], esfuerzo: bajo}

  - id: B4.11
    nombre: SVR (RBF)
    slug: svr
    prioridad: P3
    estado: falta
    implementar: {donde: rio_search/models.py, que: "adaptador sklearn; un modelo por horizonte", depende_de: [scikit-learn], esfuerzo: bajo}

  - id: B4.12
    nombre: Proceso Gaussiano
    slug: gp
    prioridad: P3
    estado: falta
    implementar: {donde: rio_search/models.py, que: "adaptador sklearn con kernel Matérn + periódico", depende_de: [scikit-learn], esfuerzo: medio}
    nota: "Da incertidumbre calibrada gratis. Escala mal con 7.000 filas de TRAIN: usar aproximación inducida o submuestreo, y dejarlo escrito."

  - id: B4.13
    nombre: DLinear / NLinear
    slug: dlinear
    prioridad: P1
    estado: falta
    valor: "descomposición tendencia+estacional y una capa lineal por componente sobre la ventana"
    implementar: {donde: rio_search/models.py, que: "sobre las secuencias de B2.17; es lineal, corre en NumPy sin torch", depende_de: [B2.17], esfuerzo: medio}
    referencia: >-
      Zeng et al. 2023, "Are Transformers Effective for Time Series Forecasting?" (AAAI).
      **Control obligatorio antes de cualquier transformer.** Barato y sin dependencias
      nuevas: es la celda de mejor relación evidencia/costo de todo B4.

  - id: B4.14
    nombre: LSTM
    slug: lstm
    prioridad: P1
    estado: falta
    implementar: {donde: rio_search/models.py (torch), que: "adaptador torch con detección de device", depende_de: [torch, B2.17], esfuerzo: alto}
    referencia: >-
      Kratzert et al. 2018/2019: el LSTM es el estado del arte en rainfall-runoff y supera
      a los modelos conceptuales calibrados. Es la referencia contra la que la tesis se va
      a medir, quiera o no.

  - id: B4.15
    nombre: BiLSTM
    slug: bilstm
    prioridad: P1
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    nota: >-
      Es el baseline que `rio_search_plan.md` Fase 3 pone como objetivo. Ojo con el nombre:
      bidireccional sobre la ventana de **entrada** (pasado) es legítimo; bidireccional
      sobre el horizonte de salida sería fuga. Dejarlo escrito y verificarlo en la auditoría.

  - id: B4.16
    nombre: GRU
    slug: gru
    prioridad: P2
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: bajo}
    nota: "Con TRAIN de ~7.000 días, menos parámetros que LSTM suele ser una ventaja real, no un ahorro."

  - id: B4.17
    nombre: Seq2Seq encoder-decoder con atención
    slug: seq2seq
    prioridad: P2
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    nota: "Es la arquitectura natural para 8 horizontes: el decoder genera la secuencia de salida en vez de 8 cabezas independientes."

  - id: B4.18
    nombre: TCN (convolución causal dilatada)
    slug: tcn
    prioridad: P1
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: medio}
    referencia: >-
      Bai, Kolter & Koltun 2018. Campo receptivo largo con pocos parámetros y sin estado
      recurrente; la causalidad es estructural, no una convención — encaja con el invariante
      del proyecto. Entrena más rápido que un LSTM y suele empatarle.

  - id: B4.19
    nombre: N-BEATS
    slug: nbeats
    prioridad: P2
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    referencia: "Oreshkin et al. 2020. Bloques residuales con base interpretable (tendencia/estacionalidad)."

  - id: B4.20
    nombre: N-HiTS
    slug: nhits
    prioridad: P2
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
    referencia: "Challu et al. 2023. N-BEATS con muestreo multi-resolución; suele ganarle en horizontes largos, que acá es t+14."

  - id: B4.21
    nombre: Transformer vanilla
    slug: transformer
    prioridad: P2
    estado: falta
    implementar: {donde: "igual que B4.14", depende_de: [torch, B2.17], esfuerzo: alto}
