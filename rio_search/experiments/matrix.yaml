- id: B8
  nombre: Modulador de régimen (sensibilidad, no ajuste)
  eje: modulador
  pregunta: "¿La conclusión depende de los parámetros del modulador?"
  criterio_de_cierre: "B8.01–B8.03 corridas."
  regla: >-
    R9 del protocolo: τ_max y los umbrales de régimen NO se eligen por métrica. Este bloque
    mide sensibilidad y su salida es una frase del tipo "la conclusión se sostiene / no se
    sostiene en el rango explorado", nunca "el mejor τ_max es X".
  celdas:

  - id: B8.01
    nombre: barrido de τ_max
    slug: tau_max_sweep
    prioridad: P1
    estado: implementado
    valor: "τ_max ∈ {0.60, 0.70, 0.80, 0.85, 0.90, 0.95}, medido siempre con τ_max = 0,85"
    cmd: -m rio_search.sensitivity --seeds 3 --split val --gate-rain lluvia_media_est_mm
    tiempo_est_s: 300
    nota: >-
      **Pasar `--split val` explícitamente**: el default del CLI es `test` y eso viola R3.
      El τ de referencia fijo es lo que hace comparables las filas: sin él, el umbral de
      "día húmedo" se movería junto con el parámetro.

  - id: B8.02
    nombre: oráculo vs causal
    slug: tau_modes
    prioridad: P1
    estado: implementado
    valor: "modo `oracle` (lluvia futura observada) vs `antecedent` (sólo pasado)"
    cmd: -m rio_search.sensitivity --tau-modes --seeds 3 --split val --gate-rain lluvia_media_est_mm
    tiempo_est_s: 200
    nota: >-
      El único operable hoy es `antecedent`. `oracle` es retrospectivo y no es causal — hay
      un test que lo deja escrito. **Si la conclusión sólo se sostiene con el oráculo, hay
      que decirlo**, y es un hallazgo de la tesis, no un problema a esconder.

  - id: B8.03
    nombre: fuente de lluvia del modulador
    slug: gate_rain_merge
    prioridad: P1
    estado: implementado
    valor: "grilla MERGE de CPTEC (media areal real) en vez de la media por estación del ancla"
    cmd: -m rio_search.train --loss gral --seeds 5 --gate-rain lluvia_merge_alta_frontera_mm --hidden 38 --lr 0.0492 --l2 0.000217 --epochs 378 --split val
    tiempo_est_s: 12
    medido:
      fecha: 2026-09-05
      val: {gral: 0.5488, gral_sd: 0.0118, rmse: 1013, nse: 0.20, kge: 0.49, v_plus: 0.530, v_minus: 0.657}
      dias: 9664
    nota: >-
      **Es la celda más consecuente de B8, no un detalle.** Con hiperparámetros idénticos,
      cambiar la fuente mueve val/gral de 0,4969 a 0,5488 — cuatro veces el umbral de ruido
      — y da vuelta el perfil de régimen (V⁺ 0,365 → 0,530, V⁻ 0,747 → 0,657). Las dos
      series correlacionan 0,90 y sus τ 0,93, pero τ entra en la pérdida Y en la métrica, así
      que cambiarla cambia las dos cosas a la vez: **el número no es comparable con el del
      ancla como si midieran lo mismo**. MERGE es la fuente hidrológicamente preferible
      (media areal real, cobertura completa, estacionaria); la media por estación depende de
      qué pluviómetros reportaron ese día. Si esta celda pasa a ser el ancla, hay que
      re-correr B9.01 bajo MERGE antes de seguir: los HP vigentes se buscaron bajo estaciones.

  - id: B8.04
    nombre: barrido de κ, pesos y ventanas
    slug: gate_params
    prioridad: P2
    estado: implementado
    valor: "kappa ∈ {1.5, 2.2, 3.0}; w_ant/w_fc ∈ {0.5/0.5, 0.35/0.65, 0.2/0.8}; ant_days ∈ {15, 30, 60}"
    cmd: -m rio_search.sensitivity --gate-grid --seeds 3 --split val --gate-rain lluvia_media_est_mm
    tiempo_est_s: 420
    nota: >-
      Producto completo: 27 puntos, 3 semillas cada uno, siempre **medido con la
      configuración declarada** (como el barrido de τ_max: lo que cambia es con qué τ se
      entrena). Cada punto reporta su reparto húmedo/neutro/seco — κ = 2,2 da ≈ 35/30/35 %
      y con κ = 1,5 casi no hay días fuera del centro, así que sin el reparto las filas no
      son comparables. `ant_days` mueve las filas iniciales sin τ: cada punto se alinea por
      fecha contra la referencia antes de entrenar.

  - id: B8.05
    nombre: modulador en modo forecast
    slug: tau_forecast
    prioridad: P1
    estado: implementado
    valor: "30 d observados + 14 d de pronóstico ECMWF real (ecmwf_cf_tp_mm_d1..d14)"
    cmd: -m rio_search.sensitivity --tau-modes --modes oracle,antecedent,forecast --seeds 3 --split val --gate-rain lluvia_media_est_mm
    tiempo_est_s: 420
    nota: >-
      Es el único modo **operable** que usa información de futuro. Desbloqueada el
      2026-09-15 por las columnas ECMWF de Gold. **Cobertura medida en d303**: 6.647 de
      9.754 filas (68,1 %), 2006-11-29 → 2026-09-11, continua salvo un hueco de 580 días
      (2017 completo y parte de 2018) — VAL y TEST quedan cubiertos por entero; el costo
      es TRAIN. Por eso el contraste corre los tres modos sobre la **intersección común
      de fechas**: comparar contra un modo con más historia mediría el período, no el modo.

