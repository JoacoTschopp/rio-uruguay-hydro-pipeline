# configs/experiments/seasonal_naive_baseline_v1.yaml (Fase 2, docs/rio_search_plan.md §5)
name: seasonal_naive_baseline_v1
description: >
  Baseline naive estacional (caudal, multi-output): predice para la fecha objetivo (anchor+h) el
  valor observado 365 dias antes de esa fecha (anchor+h-365), via el historico completo del target
  (set_history, no la ventana de Sequences -- ver infrastructure/models/naive/seasonal_naive.py).

dataset:
  source: gold_training_dataset_v0
  refresh: ensure_latest
  version: latest
  target: caudal
  horizons: [1, 2, 3, 4, 5, 6, 7, 14]

provenance:
  require_clean_git: false

split:
  policy: rolling_365
  embargo_days: 14
  train_window:
    start: 2000-01-01

sequence:
  lookback_days: 1            # ver infrastructure/models/naive/base.py; el lookback de 365 dias
                               # que necesita este baseline lo cubre set_history(), no la ventana.

model:
  name: seasonal_naive
  horizon_strategy: multi_output
  params: {}

training:
  seed: 42
  device: auto

tracking:
  experiment: /Users/joaquintschopp@gmail.com/rio_search/baselines
  tags: {thesis_chapter: baseline, baseline: seasonal_naive}
  register_model: false
